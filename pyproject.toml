[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instanceprefs"
version = "0.1.0"
description = "Show the server list and game options of a launcher instance as text, and copy them into another instance. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Younes Z." }]
keywords = [
  "minecraft",
  "prismlauncher",
  "instance",
  "servers.dat",
  "options.txt",
  "nbt",
  "settings",
  "migrate",
  "export",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rezarys/instanceprefs"
Issues = "https://github.com/Rezarys/instanceprefs/issues"

[project.scripts]
instanceprefs = "instanceprefs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
